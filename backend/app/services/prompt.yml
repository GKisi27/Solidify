prompt: |
  Analyze the provided 2D mechanical CAD image that contains multiple views (front, top, right, etc.). If it is a plate then, perform the below activities. If the image is a shaft then avoid the "PLATE" instructions and head straight to "SHAFT" instructions.
          
      PLATE:
      
      Analyze the provided 2D mechanical CAD image that contains multiple views(front,top..). The image contains a contour defined by a sequence of lines and arcs, along with associated dimensions (lengths and radii).
      Your task is to accurately extract the coordinates of all unique vertices, which include the endpoints of straight line segments and the tangency points of arc segments, that define the main visible geometry's contour.
      Don't take dimensions and extension lines as part of geometry.
      🚨🚨Read the instruction below first before proceeding to steps and output requirements.🚨🚨
      ===================================================================================================
      == 🚨🚨🚨🚨🚨  READ THIS FIRST — DO NOT PROCEED UNTIL UNDERSTOOD  🚨🚨🚨🚨🚨                ==
      ==                THIS BLOCK OVERRIDES ALL OTHER SLOT LOGIC                                      ==
      ==                FAILURE TO FOLLOW THIS = AUTOMATIC INVALID OUTPUT                              ==
      ==
      == <CRITICAL_INSTRUCTION>                                                                        ==
      ==-*Instruction number 6 is the most important one.
      == 🔴🔴🔴  THREE-CENTERLINE SLOT PROTOCOL (MANDATORY)  🔴🔴🔴                                 ==
      == You will encounter "Slot" (obround) geometries marked with THREE parallel centerlines.        ==
      == "Slot" can be placed both horizontally and vertically in the drawing.                         ==
      == YOU MUST STRICTLY ADHERE TO THIS INTERPRETATION LOGIC — NO EXCEPTIONS.                        ==
      == 1. Identification                                                                             ==
      ==    - If a slot has a central axis line AND two marking lines on either side,                  ==
      ==      it is a "Three-Centerline Slot."                                                         ==
      == 2. The Middle Line                                                                            ==
      ==    - Represents the geometric CENTROID (Symmetry Axis) ONLY.                                  ==
      ==    - It is NOT an arc center.                                                                 ==
      == 3. The Dimension                                                                              ==
      ==    - The length dimension provided is the CENTER-TO-CENTER distance                           ==
      ==      (distance between the two outer lines).                                                  ==
      == 4. STRICT SLOT HANDLING (ABSOLUTE RULE)                                                       ==
      ==    - You are FORBIDDEN from using the middle line as an arc center.                           ==
      ==    - You MUST mathematically offset from the middle line by (Dimension / 2)                   ==
      ==      to find the true center_x or center_y for the ARCs.                                      ==
      == 5. Calculation                                                                                ==
      ==    - Start at the Middle Line coordinate.                                                     ==
      ==    - Add/Subtract EXACTLY HALF of the provided length dimension                               ==
      ==      to find the TWO TRUE ARC CENTERS.                                                        ==
      == 6. Decomposition                                                                              ==
      ==    - Output the slot as EXACTLY 2 ARCs and EXACTLY 2 LINEs.                                   ==
      ==                                                                                               ==
      == ❌ "FAILURE TO DISTINGUISH THE MIDDLE CENTERLINE FROM THE OUTER ARC CENTERS                   ==
      ==    WILL RESULT IN INVALID COORDINATES."                                                       ==
      ==                                                                                               ==
      == </CRITICAL_INSTRUCTION>                                                                       ==
      +-----------------------------------------------------------------------------------------------+
      |   STEPS FOR COORDINATE EXTRACTION                                                             |
      +-----------------------------------------------------------------------------------------------+
      |                                                                                               |
      | 1) Determine the Bounding Box                                                                 |
      |    - Calculate the absolute minimum X and minimum Y values for the entire visible geometry.   |
      |                                                                                               |
      | 2) Set the Origin                                                                             |
      |    - Establish the origin (0.00, 0.00) at the absolute bottom-left corner of the geometry's   |
      |      bounding box. All extracted coordinates must be non-negative relative to this new origin.|
      |                                                                                               |
      | 3) Trace the Contour                                                                          |
      |    - Start the extraction from the lowest point on the leftmost side of the visible geometry  |
      |      and proceed sequentially along the contour.                                              |
      |                                                                                               |
      | 4) Calculate Coordinates                                                                      |
      |    - Use the provided dimensional values (lengths and radii) to calculate the precise         |
      |      (X, Y) coordinates of each unique vertex (endpoints and tangency points)                 |
      |      relative to the (0.00, 0.00) origin.                                                     |
      |                                                                                               |
      +-----------------------------------------------------------------------------------------------+
      OUTPUT REQUIREMENTS
      Return a single, plain text string containing only the extracted coordinates.
      Strict adherence to the schema: ...
      SCHEMA
      {
      "views": [
      {
      "name": "front",
      "entities": [ ... ]
      },
      {
      "name": "right",
      "entities": [ ... ]
      }
      ],
      "metadata": { "units": "mm", "scale": 1 }
      }
      +=================================================================================================+
      | RULES (MANDATORY COMPLIANCE)                                                                    |
      +=================================================================================================+
      | 1. entities array must contain objects of type: LINE, ARC, CIRCLE.                              |
      |    - LINE → start_x, start_y, end_x, end_y.                                                     |
      |    - ARC → center_x, center_y, radius, start_x, end_x, start_y, end_y, clockwise.               |
      |    - CIRCLE → center_x, center_y, radius.                                                       |
      |                                                                                                 |
      | 2. Don't include hidden / construction lines in entities (only for reference dimensions).       |
      |                                                                                                 |
      | 3. metadata must always include "units": "mm" and "scale": 1.                                   |
      |                                                                                                 |
      | 4. All numeric values must be numbers (no strings).                                             |
      |                                                                                                 |
      | 5. Include all entities visible in the drawing. Do not omit any.                                |
      |                                                                                                 |
      | 6. Preserve at least 3 decimal places for precision.                                            |
      |                                                                                                 |
      | 7. No text or explanation — return only valid JSON following this pattern exactly.              |
      |                                                                                                 |
      | 8. Fillet are same as ARC. Convert fillet into arc type.                                        |
      |    Note: identify only mentioned primitives (LINE, CIRCLE, ARC).                                |
      |                                                                                                 |
      | 9. See the bigger picture (whole) in drawing (do not focus on other boundary only).             |
      |                                                                                                 |
      | 10. For entities of each view make a separate reference point to start entities from.           |
      |                                                                                                 |
      | 11. Deduce the missing dimensions for one view by inferring to other that have a known          |
      |     dimension.                                                                                  |
      |                                                                                                 |
      | 12. Views name must only be front or right or top — nothing else.                               |
      |                                                                                                 |
      | 13. Read views name from the drawing if provided.                                               |
      |                                                                                                 |
      +=================================================================================================+
      FINAL RESPONSE FORMAT
      Return ONLY the plain text string of coordinates, nothing else.
      Before providing your final answer, start your response with the word 'CHECK:' followed by a confirmation that you have met the critical requirement of [CRITICAL_INSTRUCTION]. Then provide the answer.
                  
      SHAFT:
      
      If the image is a shaft then
      Analyze the provided 2D mechanical CAD image of a cylindrical shaft/pin. The image contains a front view (length and outer profile) and may contain a sectional view showing hollowness or internal bores.
          Task:
          1) Identify the revolve axis (centerline) and state its direction (horizontal or vertical). Include the axis in the final JSON as "revolve_axis".
          2) Extract the outer contour from the FRONT view (upper-half profile for revolve).
          3) If a SECTION view (labelled "section", "A-A", or similar) shows internal hollowness / bores:
          - Measure inner diameters from that section.
          - Project those inner profiles into the FRONT view coordinate system.
          - Add these inner profiles as separate closed loops in the SAME "front" view entities.
          - In section view, the solid parts are hashed and the hollow part is plain white space.
          - Use the sectional view to detect hollowness or internal features.
          - Include internal steps, hollowness, bore transitions, arcs, and chamfers revealed in the sectional view into the extracted geometry.
          - Ensure all added internal segments connect end-to-end in order and match the front view's axis and coordinate system.
          5)A fillet is a rounded corner between two intersecting lines.Fillet are same as ARC. convert fillet into arc type.
          6)A chamfer is a straight edge connecting two intersecting lines, replacing a corner with a beveled line and are represented with distance*angle(with horizontal).Represent chamfers as LINE primitives.
          7)If hidden lines passes through entire geometry the shaft is hollow.Strictly on such condition represent them as LINE primitives.
              a)Section view are usually given for shafts/cylinders with internal blind or through holes.
          8)Note:identify only mentioned primitives(LINE, CIRCLE, ARC).
          9) Output ONLY a plain-text JSON string with coordinates in millimeters and this structure:
          {
          "views": [
          {
              "name": "front",
              "entities": [
              { "type":"LINE", "start_x":0.0, "start_y":0.0, "end_x":0.0, "end_y":29.98 },
              { "type":"CIRCLE", "center_x":0.0, "center_y":0.0, "radius":16.0 }
              ],
              "metadata": {"units":"mm", "scale": 1 }
          }
          ],
          "revolve_axis": {"start_x":0.0, "start_y":0.0, "end_x":100.0, "end_y":0.0 }
          }
          Notes:
          - Use 'LINE' for straight segments, 'ARC' for curved arcs, 'CIRCLE' when an entire circle is present.
          - Ensure the inner loop shares the same axis and center as the outer profile (concentric) whenever the drawing implies symmetry.
          - Do not output any explanatory text — only the JSON.
          - Check for symmetry if present.
          - All linear, radial, angular, and diameter values MUST be copied EXACTLY as written
            in the drawing annotations.
