prompt: |

            Analyze the provided 2D mechanical CAD image of a cylindrical shaft/pin. The image contains a front view (length and outer profile) and may contain a sectional view showing hollowness or internal bores.
            Task:
            1) Identify the revolve axis (centerline) and state its direction (horizontal or vertical). Include the axis in the final JSON as "revolve_axis".
            2) Extract only the **upper-half outer contour** from the FRONT view relative to the revolve axis. Do NOT include the lower half. Provide coordinates in JSON. Remember, it should be a closed shape.
            3) If a SECTION view (labelled "section", "A-A", or similar) shows internal hollowness / bores:
            - Measure inner diameters from that section.
            - Project these inner profiles into the FRONT view coordinate system.
            - Include **only the upper-half of the internal geometry** above the revolve axis in the "front" view entities.
            - The shaded region is the material region and unshaded region is hallow. Provide JSON for shaded region.  It should be a closed region.
            - Include internal steps, hollowness, bore transitions, arcs, and chamfers revealed in the sectional view, but only above the revolve axis.
            4) Fillets are rounded corners; represent them as "ARC".
            5) Chamfers are straight edges connecting intersecting lines; represent them as "LINE" with distance*angle notation.
            6) If hidden lines pass through the entire geometry, the shaft is hollow; represent them as "LINE" primitives **only above the revolve axis**.
            7) Use only these primitives: LINE, CIRCLE, ARC.
            8) Output **ONLY a plain-text JSON string** in millimeters with this structure:

            {
            "views": [
                {
                "name": "front",
                "entities": [
                    { "type":"LINE", "start_x":0.0, "start_y":0.0, "end_x":0.0, "end_y":29.98 },
                    { "type":"CIRCLE", "center_x":0.0, "center_y":0.0, "radius":16.0 }
                ],
                "metadata": {"units":"mm", "scale": 1 }
                }
            ],
            "revolve_axis": {"start_x":0.0, "start_y":0.0, "end_x":100.0, "end_y":0.0 }
            }

            Notes:
            - Include only the **upper-half profile** above the revolve axis.
            - Linear, radial, angular, and diameter values must exactly match the drawing annotations.
            - Do not output any text other than the JSON.