version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:solidify123@postgres:5432/mydb
      REDIS_HOST: redis
      DATA_DIR: /solidify/data
      QDRANT_URL: http://qdrant_vector_db:6333
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      USE_CELERY: "true"
      PYTHONPATH: /:/app
    volumes:
      - ./backend:/app
      - ./data:/solidify/data
      - ./worker:/worker

  celery_worker:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: celery_worker
    command: celery -A worker.celery_app worker --concurrency=4 --loglevel=info
    depends_on:
      - redis
      - postgres
      - backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:solidify123@postgres:5432/mydb
      REDIS_HOST: redis
      DATA_DIR: /solidify/data
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PYTHONPATH: /app:/
    volumes:
      - ./backend:/app
      - ./data:/solidify/data
      - ./worker:/worker
    restart: unless-stopped

  flower:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: flower_monitor
    command: sh -c "cd /app && celery -A worker.celery_app flower --port=5555"
    ports:
      - "5555:5555"
    depends_on:
      - redis
      - celery_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:solidify123@postgres:5432/mydb
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      PYTHONPATH: /app:/
    volumes:
      - ./backend:/app
      - ./data:/solidify/data
      - ./worker:/worker
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - CHOKIDAR_USEPOLLING=true

  postgres:
    image: postgres:15.5
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: solidify123
      POSTGRES_DB: mydb
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis_cache
    ports:
      - "6380:6379"  # changed to avoid conflict

  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: qdrant_vector_db
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  postgres_data:
  qdrant_storage: