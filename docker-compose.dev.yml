services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: backend
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
    volumes:
      - ./backend:/app
      - ./data:/solidify/data
      - ./worker:/app/worker
    environment:
      - PYTHONPATH=/app
    # FIX: Use app.main:app (since you have an app/ folder) 
    # AND exclude data/pycache from reloading to save memory
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-exclude "*/__pycache__/*" --reload-exclude "/solidify/data/*"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: celery_worker
    command: celery -A worker.celery_app worker --concurrency=4 --loglevel=info
    env_file:
      - .env.local
    depends_on:
      - redis
      - postgres
      - backend
    volumes:
      - ./backend:/app
      - ./data:/solidify/data
      - ./worker:/app/worker
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: flower_monitor
    command: celery -A worker.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - .env.local
    depends_on:
      - redis
      - celery_worker
    volumes:
      - ./backend:/app
      - ./data:/solidify/data
      - ./worker:/app/worker
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    ports:
      - "3000:5173"
    env_file:
      - .env.local
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - CHOKIDAR_USEPOLLING=true

  postgres:
    image: postgres:15.5
    container_name: postgres_db
    env_file:
      - .env.local
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis_cache
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: qdrant_vector_db
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  postgres_data:
  qdrant_storage: